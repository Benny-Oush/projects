name: CI Pipeline
on:
  push:
    paths:
      - "classes/shi/FlaskTodo/**"
      - ".github/workflows/ci.yml"

jobs:
  integration-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: classes/shi/FlaskTodo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start services
        run: docker compose up -d --build

      - name: Apply database migrations
        # Fresh CI database: create the schema via Flask-Migrate (no create_all).
        run: docker compose exec -T backend flask db upgrade

      - name: Show running containers
        run: docker ps

      - name: Run integration smoke test (inside the docker network)
        run: docker compose run --rm testserver

      - name: Show backend logs on failure
        if: failure()
        run: docker compose logs backend

      - name: Shut down containers
        if: always()
        run: docker compose down -v --remove-orphans
  build-and-push:
    needs: integration-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug Secret Mapping
        run: |
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Error: The token is empty or not found!"
            exit 1
          else
            echo "Success: The token is securely loaded."
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./classes/shi/FlaskTodo/backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-todo-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-todo-backend:${{ github.sha }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./classes/shi/FlaskTodo/frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-todo-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-todo-frontend:${{ github.sha }}
          # k
