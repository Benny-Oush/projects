<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Divs</title>
  </head>
  <body>
    <h1>Divs Creation</h1>
    <div id="inputs">
      <span>Enter a height value</span>
      <input id="height" type="number" value="100" placeholder="Enter the divs' height"/>
      <span>Enter a width value</span>
      <input id="width" type="number" value="200" placeholder="Enter the divs' width" />
      <span>Enter a border width value</span>
      <input id="border-width" value="2" type="number" placeholder="Enter divs' borders' width"/>
      <span>Enter text</span>
      <input id="text" type="text" placeholder="Enter the divs' text..." />
      <span>Enter the divs' color </span>
      <input id="color" value="yellow" type="color" />
      <span>Enter the number of divs</span>
      <input id="divs-num" value="3" type="number" placeholder="Enter the numbers of divs to create">
    </div>

    <button id="create-divs">create</button>
    <div id="container"></div>
    <script src="script.js"></script>
  </body>
</html>
