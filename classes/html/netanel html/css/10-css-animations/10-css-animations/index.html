<!DOCTYPE html>
<html lang="he">
<head>

    <title>תרגיל: אנימציות</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>תרגיל אנימציות ב-CSS</h1>

    <section>
        <h2>1. ספינר טעינה (Loading Spinner)</h2>
        <div class="spinner">
            <div class="bg"></div>
            <div class="fg"></div>
            <div class="choop"></div>

    <section>
        <h2>2. כפתור פועם (Pulse Button)</h2>
        <button class="pulse-button">לחץ עלי!</button>
    </section>
</body>
