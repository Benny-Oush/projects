<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Faster+One&family=Michroma&family=Nabla&family=Science+Gothic:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>ROCK PAPER SCISSORS</h1>
    <div id="stats">
      <h2 id="round">Round 1</h2>
      <h2 id="score">0 : 0</h2>
    </div>
    <div id="choices">
      <div id="user" class="chosen"></div>
      <div id="vs"></div>
      <div id="bot" class="chosen"></div>
    </div>
    <h2 id="status">Make your choice</h2>
    <div class="options">
      <div id="rock" class="option"></div>
      <div id="paper" class="option"></div>
      <div id="scissors" class="option"></div>
    </div>
    <button id="next-round">NEXT ROUND</button>
    <script src="script.js"></script>
  </body>
</html>
