<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <table border="1">
      <tr>
        <th>tags</th>
        <th>attributes</th>
      </tr>
      <td>
        <ol>
          <li>body</li>
          <li>table</li>
          <li>tr</li>
          <li>th</li>
          <li>ol</li>
        </ol>
      </td>
      <td>
        <ol>
          <li>type</li>
          <li>id</li>
          <li>text</li>
          <li>titel</li>
          <li>href</li>
        </ol>
      </td>
    </table>
    <br />
    <form>
      <label>user name</label>
      <input
        type="text"
        id="username"
        name="user_name"
        placeholder="הכנס שם משתמש"
        required
      />
      <br /><br />

      <label>full name:</label>
      <input type="text" placeholder="ישראל ישראלי" required /> <br /><br />

      <label>password</label>
      <input type="password" name="pwd" required /> <br /><br />

      <label>age</label>
      <input type="number" min="18" max="99" value="25" /> <br /><br />

      <input type="submit" value="שלח טופס" />
    </form>
  </body>
</html>
