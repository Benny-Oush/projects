<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="gemini.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Missing number</title>
  </head>
  <body>
    <h1>Missing number</h1>
    <div id="top">
      <h2 id="top-score">Top score: 0</h2>
      <button id="reset">RESET</button>
    </div>
    <h2 id="score">Score: 0</h2>
    <h2 id="status">Press START to start</h2>
    <button id="start">START</button>
    <h2 id="count-down">Count down</h2>
    <div id="cont">
      <div class="row">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
      <div class="row">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
      <div class="row">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
      <div class="row">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
    </div>
    <div id="numbers">
      <div class="num">1</div>
      <div class="num">2</div>
      <div class="num">3</div>
      <div class="num">4</div>
      <div class="num">5</div>
      <div class="num">6</div>
      <div class="num">7</div>
      <div class="num">8</div>
      <div class="num">9</div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
